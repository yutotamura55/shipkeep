[project]
name = "shipkeep"
version = "0.1.0"
description = "Agent skills that keep vibe-coded software fit to ship."
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# S101：pytest は assert で結果を確かめるため、テストでは除く。
# subprocess の呼び出し (S603・S607) は、確かめた箇所ごとに理由を書いて除く。
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["hotspots", "inventory", "scan"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["skills", "tests"]
mypy_path = [
    "skills/shipkeep-publish-check/scripts",
    "skills/shipkeep-quality-tools/scripts",
    "skills/shipkeep-refactor/scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# skill のスクリプトだけを測る。テストのコードは対象にしない。
source = ["skills"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# 2026-11-04 に測った値を、小数第 2 位で切り捨てた値。
# 丸めると、pytest-cov が下限に届かない (FAIL) と表示しながら成功する。
# 下回ったら失敗にする。テストを足して上がったら、この値も上げる。
fail_under = 97.81
precision = 2
